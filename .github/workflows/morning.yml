name: Morning lead run

on:
  schedule:
    # Main start: the database's own timer starts this run at 07:45 India time (pg_cron job leadfinder-morning),
    # because GitHub's scheduler ran hours late. These GitHub times stay as backups.
    # Odd minutes on purpose: GitHub is busiest at :00 and :30 and drops scheduled runs then.
    # The database picks today's 10 leads itself at 08:45 India time even if every run here is dropped.
    - cron: "19 2 * * *"   # 07:49 India time, every day (email about 8:40 AM)
    # Backups: these do nothing if today's email already went out.
    - cron: "41 3 * * *"   # 09:11 India time
    - cron: "7 5 * * *"    # 10:37 India time
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the agents work (minutes)"
        default: "45"
      send_email:
        description: "Send the lead email at the end (yes/no)"
        default: "yes"
      daily:
        description: "Started by the database's daily timer (skips if today's email already went out)"
        default: "no"

concurrency:
  group: leadfinder
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only used to keep the daily schedule switched on

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      WORKER_CODE: ${{ secrets.WORKER_CODE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      APP_URL: ${{ secrets.APP_URL }}
      REPORT_LEADS: "10"         # Shreya calls 7-10 shops a day
      REPORT_COUNTRIES: "IN"     # the morning email is India-only for now; add US when calling the USA
      CHECK_MIX: "IN,IN,US"      # two rounds of India checks for every round of US checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Already done today?
        id: guard
        run: |
          sent=$(.venv/bin/python -m leadfinder sent-today 2>/dev/null | tail -1 || echo 0)
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.daily }}" = "yes" ]; } && [ "${sent:-0}" -gt 0 ]; then
            echo "Today's email already went out ($sent leads) - this backup run stops here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Score and check the best leads (about 45 minutes)
        if: steps.guard.outputs.skip != 'true'
        run: .venv/bin/python -m leadfinder worker --minutes ${{ inputs.minutes || '45' }}
      - name: Email today's leads
        # !cancelled(): a stopped run must never send the email
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email != 'no') }}
        run: .venv/bin/python -m leadfinder email --since-hours 4
      - name: Research today's hot leads and write sales briefs (about 15 minutes)
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        continue-on-error: true
        run: .venv/bin/python -m leadfinder briefs
      - name: Keep the daily schedule switched on
        # GitHub pauses schedules in repos with no activity for 60 days; this resets that timer.
        # Only on scheduled runs that weren't stopped, so it never re-enables a schedule someone paused.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/morning.yml/enable" || true

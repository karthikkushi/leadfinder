<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex, nofollow">
  <title>Lead Finder</title>
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lead Finder">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <img src="icon-192.png" alt="" width="56" height="56" class="login-logo">
      <h1>Lead Finder</h1>
      <p class="muted">Paste your access code or the login link you were sent.</p>
      <form id="login-form">
        <label class="sr-only" for="code-input">Access code</label>
        <input id="code-input" type="password" autocomplete="current-password" placeholder="Access code or login link" required>
        <button class="btn primary wide" type="submit">Open</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="icon-192.png" alt="" width="30" height="30">Lead Finder</div>
      <div class="top-actions">
        <label class="sr-only" for="country">Country</label>
        <select id="country" class="country-select"></select>
        <button id="settings-btn" class="icon-btn" aria-label="Settings"></button>
      </div>
    </header>

    <div id="install" class="install" hidden>
      <img src="icon-192.png" alt="" width="34" height="34">
      <span id="install-text">Add Lead Finder to your home screen</span>
      <button id="install-btn" class="btn primary small">Install</button>
      <button id="install-close" class="icon-btn" aria-label="Hide"></button>
    </div>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections">
      <button data-tab="today" class="active"><span class="ti" data-icon="flame"></span><span>Today</span></button>
      <button data-tab="all"><span class="ti" data-icon="list"></span><span>All leads</span></button>
      <button data-tab="callbacks"><span class="ti" data-icon="clock"></span><span>Follow-ups</span><b class="badge" id="cb-badge" hidden></b></button>
      <button data-tab="results"><span class="ti" data-icon="trophy"></span><span>Results</span></button>
      <button data-tab="more"><span class="ti" data-icon="dots"></span><span>More</span></button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"><div id="sheet-body"></div></dialog>

  <dialog id="settings" class="sheet">
    <form method="dialog" class="stack pad">
      <div class="sheet-head"><h2>Settings</h2><button class="icon-btn close" value="cancel" aria-label="Close"></button></div>
      <p class="muted small">These fill in the call script and the WhatsApp message on this phone.</p>
      <label>Your name<input id="s-name" placeholder="e.g. Shreya"></label>
      <label>Company name<input id="s-company" placeholder="e.g. Kalvio Build"></label>
      <label>Price you quote (optional)<input id="s-price" placeholder="e.g. from ₹3,000"></label>
      <label>Free sample link (optional)<input id="s-sample" placeholder="e.g. https://kalvio-build.vercel.app"></label>
      <button class="btn primary wide" value="save">Save</button>
      <button id="logout-btn" class="btn ghost wide danger" type="button">Log out on this phone</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="meta.js"></script>
  <script src="app.js"></script>
</body>
</html>
